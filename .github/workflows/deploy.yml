name: Deploy de Produção

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e publicação do Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/profaristoteles/isentidosbot-backend:latest
            ghcr.io/profaristoteles/isentidosbot-backend:${{ github.sha }}

      - name: Build e publicação do Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/profaristoteles/isentidosbot-frontend:latest
            ghcr.io/profaristoteles/isentidosbot-frontend:${{ github.sha }}

      - name: Acionar Portainer
        if: env.PORTAINER_WEBHOOK_URL != ''
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          curl --fail --silent --show-error \
            -X POST \
            "$PORTAINER_WEBHOOK_URL"
