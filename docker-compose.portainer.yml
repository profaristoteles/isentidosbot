services:

  postgres:
    image: postgres:16-alpine
    container_name: isentidosbot-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: isentidos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: isentidosbot
      TZ: America/Fortaleza

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - internal_network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isentidos -d isentidosbot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s


  rsshub:
    image: diygod/rsshub:latest
    container_name: isentidosbot-rsshub
    restart: unless-stopped

    environment:
      NODE_ENV: production
      CACHE_TYPE: memory
      PUPPETEER_WS_ENDPOINT: ""
      TZ: America/Fortaleza

    networks:
      - internal_network


  backend:
    image: ghcr.io/profaristoteles/isentidosbot-backend:latest
    pull_policy: always
    container_name: isentidosbot-backend
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 5000
      TZ: America/Fortaleza

      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL}
      DATABASE_URL: ${DATABASE_URL}

      JWT_SECRET: ${JWT_SECRET}

      EVOLUTION_API_URL: ${EVOLUTION_API_URL}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE}
      EVOLUTION_WEBHOOK_SECRET: ${EVOLUTION_WEBHOOK_SECRET}
      EVOCRM_WEBHOOK_URL: ${EVOCRM_WEBHOOK_URL:-}

      RSSHUB_URL: http://rsshub:1200

      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

    volumes:
      - uploads_data:/app/uploads

    depends_on:
      postgres:
        condition: service_healthy
      rsshub:
        condition: service_started

    networks:
      - internal_network
      - traefik_network

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_network"
      - "traefik.http.routers.isentidosbot-backend.rule=Host(`isentidosbot-api.isentidos.com.br`)"
      - "traefik.http.routers.isentidosbot-backend.entrypoints=websecure"
      - "traefik.http.routers.isentidosbot-backend.tls=true"
      - "traefik.http.routers.isentidosbot-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.isentidosbot-backend.loadbalancer.server.port=5000"


  frontend:
    image: ghcr.io/profaristoteles/isentidosbot-frontend:latest
    pull_policy: always
    container_name: isentidosbot-frontend
    restart: unless-stopped

    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

    depends_on:
      - backend

    networks:
      - internal_network
      - traefik_network

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_network"
      - "traefik.http.routers.isentidosbot-frontend.rule=Host(`isentidosbot.isentidos.com.br`)"
      - "traefik.http.routers.isentidosbot-frontend.entrypoints=websecure"
      - "traefik.http.routers.isentidosbot-frontend.tls=true"
      - "traefik.http.routers.isentidosbot-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.isentidosbot-frontend.loadbalancer.server.port=3000"


networks:

  internal_network:
    driver: bridge

  traefik_network:
    external: true


volumes:

  postgres_data:
    external: true
    name: isentidosbot_postgres_data

  uploads_data:
    external: true
    name: isentidosbot_uploads_data
